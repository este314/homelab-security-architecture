# =====================================================================
# Metadatos del repositorio
# ---------------------------------------------------------------------
# Deja la descripcion y los topics del repositorio fijados desde el
# propio repositorio, sin depender de una sesion con la CLI de GitHub.
#
# Es una accion idempotente: se puede ejecutar las veces que haga
# falta y el resultado es el mismo.
#
# Uso manual: Actions -> "Metadatos del repositorio" -> Run workflow
# =====================================================================

name: Metadatos del repositorio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metadatos.yml'

# Sin bloque 'permissions': el token usa los permisos por defecto del
# repositorio. Declarar 'administration: write' aqui es invalido (esa
# clave existe para los tokens personales, no para GITHUB_TOKEN) y
# hacia que GitHub no cargase el fichero.

jobs:
  metadatos:
    name: Descripcion y topics
    runs-on: ubuntu-latest
    steps:
      - name: Fijar descripcion y topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DESCRIPCION: >-
            Arquitecturas de seguridad, observabilidad y procesamiento de datos
            en un homelab perimetral. HAProxy + Coraza + Suricata, Kafka,
            CrowdSec, Falco, ClickHouse y Grafana. ADRs, modelo de amenazas,
            runbook y configuraciones anonimizadas.
        run: |
          set -euo pipefail

          TOPICS="security,homelab,devsecops,clickhouse,crowdsec,falco,grafana,observability,waf,sre,kafka,threat-modeling"

          echo "Aplicando metadatos a $REPO"

          curl -sS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}" \
            -d "$(jq -n --arg d "$DESCRIPCION" '{description: $d}')" \
            -o /tmp/desc.json -w "descripcion: HTTP %{http_code}\n"

          curl -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/topics" \
            -d "$(jq -n --arg t "$TOPICS" '{names: ($t | split(",") | map(gsub("^\\s+|\\s+$";"")))}')" \
            -o /tmp/topics.json -w "topics:     HTTP %{http_code}\n"

          echo "--- resultado ---"
          jq -r 'if .message then "ERROR: " + .message else "descripcion: " + (.description // "(vacia)") end' /tmp/desc.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r 'if .message then "ERROR: " + .message else "topics: " + ((.names // []) | join(", ")) end' /tmp/topics.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/desc.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/topics.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
