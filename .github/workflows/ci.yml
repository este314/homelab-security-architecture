# =====================================================================
# CI · verificación de la anonimización y de la documentación
# ---------------------------------------------------------------------
# Este repositorio publica configuraciones de un entorno real. El CI
# no se limita a compilar: verifica que lo que se publica está
# realmente anonimizado.
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # 1. Barrido de secretos y de PII
  # =================================================================
  secrets:
    name: Secretos y PII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Detectar secretos
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1 \
            --config .gitleaks.toml

      - name: Dominios fuera de la lista permitida
        run: |
          # Allowlist en lugar de denylist.
          #
          # La denylist tendría que enumerar los identificadores que
          # hay que evitar, lo que significa publicarlos en el propio
          # repositorio. Con una allowlist el repo declara lo único
          # que puede aparecer: los marcadores de posición y las
          # referencias públicas. Cualquier dominio real cae fuera,
          # hoy y en el futuro, sin que haya que mantener una lista.
          PERMITIDOS='(^|\.)example\.com$|^github\.com$|^api\.github\.com$|^raw\.githubusercontent\.com$|^img\.shields\.io$|^www\.w3\.org$'

          # El grupo de subdominios admite cero repeticiones a propósito:
          # así también se capturan los nombres de una sola etiqueta
          # (nombre de una sola etiqueta), que son los más fáciles de colar.
          CANDIDATOS=$(grep -rhoIE '\b[a-zA-Z0-9][a-zA-Z0-9-]*(\.[a-zA-Z0-9][a-zA-Z0-9-]*)*\.(com|net|org|io|dev|app|cloud|info|biz|me|es|cat|uk|de|fr|it|nl|pt|eu|co|tv|xyz|tech|site|online|pro|mobi|name|blog|shop|bio|local|internal|test|zone|systems|solutions|live|world|space|studio|agency|media|news|email|link|click|digital)\b' \
            --exclude-dir=.git --exclude='*.png' --exclude='*.svg' . | sort -u)

          FALLOS=""
          for d in $CANDIDATOS; do
            if ! echo "$d" | grep -qE "$PERMITIDOS"; then
              FALLOS="$FALLOS $d"
            fi
          done

          if [ -n "$FALLOS" ]; then
            echo "::error::Dominios fuera de la lista permitida:$FALLOS"
            exit 1
          fi
          echo "Dominios: todos en la lista permitida."

      - name: Verificar que no hay IPs internas reales
        run: |
          # Sólo se permiten los rangos genéricos documentados.
          ALLOWED='192\.168\.(10|20|30)\.|10\.0\.0\.|127\.0\.0\.1|0\.0\.0\.0|255\.255\.'
          FOUND=$(grep -rInE '192\.168\.[0-9]+\.' --exclude-dir=.git --exclude='*.png' --exclude='*.svg' . \
            | grep -vE "$ALLOWED" || true)

          if [ -n "$FOUND" ]; then
            echo "::error::Direcciones IP internas fuera de los rangos genéricos:"
            echo "$FOUND"
            exit 1
          fi
          echo "Rangos IP: sin coincidencias."

      - name: Comprobar que los badges se renderizan
        run: |
          # Un badge mal formado devuelve HTTP 200 con una imagen de
          # error dentro, asi que comprobar el codigo de respuesta no
          # sirve: hay que mirar el contenido.
          FALLOS=""
          for url in $(grep -oE 'https://[^)]*badge[^)]*|https://img\.shields\.io/[^)]*' README.md); do
            # Segun el servicio, la etiqueta va en aria-label o en title
            ETIQUETA=$(curl -sL --max-time 20 "$url" \
              | grep -oE '(aria-label="[^"]*"|<title>[^<]*</title>)' | head -1)
            if echo "$ETIQUETA" | grep -qiE '404|not found|error'; then
              FALLOS="$FALLOS\n  $url -> ${ETIQUETA:-sin aria-label}"
            fi
          done

          if [ -n "$FALLOS" ]; then
            echo "::error::Badges que no se renderizan:$FALLOS"
            exit 1
          fi
          echo "Badges: todos se renderizan."

  # =================================================================
  # 2. Documentación
  # =================================================================
  docs:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint
        run: |
          npm install --silent --no-fund --no-audit markdownlint-cli2@0.14.0
          npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Comprobar enlaces internos
        run: |
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import unquote

          pattern = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          broken = []

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for name in files:
                  if not name.endswith('.md'):
                      continue
                  path = os.path.join(root, name)
                  with open(path, encoding='utf-8') as fh:
                      text = fh.read()
                  for link in pattern.findall(text):
                      link = link.split('#')[0].strip()
                      if not link or link.startswith(('http://', 'https://', 'mailto:')):
                          continue
                      target = os.path.normpath(os.path.join(root, unquote(link)))
                      if not os.path.exists(target):
                          broken.append(f"{path}: {link}")

          if broken:
              print("::error::Enlaces internos rotos:")
              for b in broken:
                  print("  " + b)
              sys.exit(1)
          print("Enlaces internos: todos resueltos.")
          PY

      - name: Comprobar que las referencias del README existen
        run: |
          # Los ADR referenciados desde el README tienen que existir.
          MISSING=0
          for f in $(grep -oE '\(docs/adr/[a-z0-9-]+\.md\)' README.md | tr -d '()' | sort -u); do
            if [ ! -f "$f" ]; then
              echo "::error::ADR referenciado pero inexistente: $f"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] && echo "Referencias del README: correctas."
          exit $MISSING

  # =================================================================
  # 3. Diagramas
  # =================================================================
  # Valida que todos los .mmd compilan y que existe el export
  # versionado de cada uno.
  #
  # NO se comparan los PNG byte a byte: el render depende de la
  # versión de mermaid y del motor de render, así que una comparación
  # exacta fallaría sin que el diagrama esté mal.
  diagrams:
    name: Diagramas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar mermaid-cli
        run: npm install --silent --no-fund --no-audit @mermaid-js/mermaid-cli@11

      - name: Validar el render de cada diagrama
        run: |
          set -euo pipefail
          mkdir -p /tmp/render

          # Chrome necesita --no-sandbox en el entorno del runner.
          cat > /tmp/puppeteer.json <<'JSON'
          { "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"] }
          JSON

          for src in docs/diagramas/*.mmd; do
            base=$(basename "$src" .mmd)
            echo "· $base"

            # 1. El diagrama tiene que renderizar sin error
            npx mmdc -i "$src" -o "/tmp/render/$base.png" \
              -b white -w 2400 -s 2 -p /tmp/puppeteer.json

            # 2. El render no puede estar vacío
            if [ ! -s "/tmp/render/$base.png" ]; then
              echo "::error::El render de $base ha salido vacío."
              exit 1
            fi

            # 3. El export versionado tiene que existir
            for ext in png svg; do
              if [ ! -s "docs/diagramas/$base.$ext" ]; then
                echo "::error::Falta el export docs/diagramas/$base.$ext"
                echo "Regenera con:"
                echo "  npx mmdc -i docs/diagramas/$base.mmd -o docs/diagramas/$base.png -b white -w 2400 -s 2"
                exit 1
              fi
            done
          done
          echo "Diagramas: todos renderizan y tienen export."
