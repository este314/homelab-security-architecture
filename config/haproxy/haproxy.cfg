# =====================================================================
# HAProxy · configuración de referencia del perímetro
# ---------------------------------------------------------------------
# Muestra anonimizada. Los dominios, IPs y rutas de certificados son
# de ejemplo; la lógica (dos motores SPOE, IP real validada, formato de
# log en JSON) es la real.
#
# Validar antes de aplicar:
#   haproxy -c -f /etc/haproxy/haproxy.cfg
#
# Los dos motores SPOE:
#   · coraza  → WAF (OWASP CRS)
#   · crowdsec→ bouncer de CrowdSec, que bloquea por IP
# =====================================================================

global
    user        haproxy
    group       haproxy
    chroot      /var/lib/haproxy
    maxconn     80000

    log /dev/log local2
    daemon

    stats socket /var/lib/haproxy/stats mode 600 level admin

defaults
    mode http
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel  24h

    # El log se escribe como JSON para que el agente Vector pueda
    # parsearlo de forma directa, sin expresiones regulares frágiles.
    log-format '{"timestamp":"%t","client_ip":"%[var(txn.real_ip)]",'\
                '"client_port":%cp,"method":"%HM",'\
                '"uri":"%[capture.req.uri,json(utf8s)]",'\
                '"protocol":"%HP","status":%ST,"bytes_read":%B,'\
                '"bytes_uploaded":%U,"duration_total":%Tt,'\
                '"backend":"%b","server":"%s","termination_state":"%tsc",'\
                '"frontend":"%ft"}'

    log global

# ---------------------------------------------------------------
# Resolution por DNS (service discovery)
# ---------------------------------------------------------------
resolvers dns
  nameserver dns1 192.168.30.53:8600
  accepted_payload_size 8192

# ---------------------------------------------------------------
# Frontend HTTPS
# ---------------------------------------------------------------
frontend https-in
    bind *:443 ssl crt /etc/haproxy/certs/example.com.pem \
                 crt /etc/haproxy/certs/example.com-0001.pem \
                 alpn h2,http/1.1
    mode http
    option forwardfor

    # 1. Identificador único de transacción (trazabilidad extremo a extremo)
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt
    unique-id-header X-Unique-ID

    # 2. IP real del cliente
    #    Sólo se acepta la cabecera del CDN si la conexión viene de un
    #    rango suyo. Sin esta comprobación, cualquiera podría enviar
    #    CF-Connecting-IP y falsear su IP de origen (y por tanto
    #    evadir una blacklist por IP).
    acl from_cdn src -f /etc/haproxy/cdn_ranges.lst
    acl has_cdn_ip req.hdr(CF-Connecting-IP) -m found

    http-request deny if has_cdn_ip !from_cdn

    http-request set-var(txn.real_ip) req.hdr(CF-Connecting-IP) if from_cdn has_cdn_ip
    http-request set-var(txn.real_ip) src if !from_cdn

    http-request set-header X-Real-IP         %[var(txn.real_ip)]
    http-request set-header X-Forwarded-Port  %[dst_port]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    # 3. WAF (SPOE)
    #    El WAF evalúa la petición y devuelve la acción. HAProxy aplica
    #    el deny: el WAF no está en el camino del paquete, sólo en el
    #    hilo de evaluación.
    filter spoe engine coraza config /etc/haproxy/coraza.cfg
    http-request send-spoe-group coraza coraza-req

    # La acción del WAF se propaga en la respuesta para depuración.
    http-response set-header X-WAF-Action %[var(txn.coraza.action)]

    http-request deny deny_status 403 \
        if { var(txn.coraza.action) -m sub deny } \
        || { var(req.coraza.action) -m sub deny }

    # 3b. Endpoint público del almacén analítico
    #
    # El almacén tiene un usuario con permisos sobre todas las bases y
    # su endpoint es público. El WAF filtra patrones SQL, pero eso NO es
    # control de acceso: la misma consulta redactada de otra forma
    # pasa. La condición es "trae el token de excepción", no "no parece
    # una inyección".
    #
    # El token se valida contra un fichero aparte con permisos 600, no
    # contra una ACL en línea, para no dejarlo en la configuración.
    #
    # Solo activar cuando TODOS los clientes externos lo envíen.
    acl is_analytics hdr(host) -i analytics.example.com
    acl ingest_token_ok req.hdr(X-Ingest-Token),map_str(/etc/haproxy/ingest_token.map) -m str OK
    http-request deny deny_status 403 if is_analytics !ingest_token_ok

    # 4. Bouncer de CrowdSec (SPOE)
    #    Segundo motor SPOE: consulta al LAPI si la IP de origen está
    #    bloqueada y, si lo está, corta la petición en la capa 7.
    filter spoe engine crowdsec config /etc/haproxy/crowdsec.cfg
    http-request send-spoe-group crowdsec crowdsec-req

    http-request deny deny_status 403 \
        if { var(txn.crowdsec.action) -m sub deny }

    # 5. Enrutado por nombre de host
    acl is_app   hdr(host) -i app.example.com
    use_backend be_app if is_app

    acl is_api   hdr(host) -i api.example.com
    use_backend be_api if is_api

    # 6. Enrutado por ruta (siempre al final del frontend)
    acl letsencrypt path_beg /.well-known/acme-challenge/
    use_backend be_letsencrypt if letsencrypt

# ---------------------------------------------------------------
# Frontend HTTP: sólo redirección a HTTPS
# ---------------------------------------------------------------
frontend http-in
    bind *:80
    redirect scheme https if !{ ssl_fc }

# ---------------------------------------------------------------
# Backends
# ---------------------------------------------------------------
backend be_app
    balance roundrobin
    server app1 app1.internal.example.com:8080 check
    server app2 app2.internal.example.com:8080 check

backend be_api
    balance roundrobin
    server api1 api1.internal.example.com:9000 check

backend be_letsencrypt
    server le acme.internal.example.com:80 check

# ---------------------------------------------------------------
# Backends con balanceo por IP de origen
# ---------------------------------------------------------------
backend be_sticky
    balance roundrobin
    stick-table type ip size 20k expire 30m
    stick on src
    server s1 s1.internal.example.com:8080 check
