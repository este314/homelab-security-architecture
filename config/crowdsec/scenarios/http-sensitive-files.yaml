# =====================================================================
# CrowdSec · escenario propio · ficheros sensibles
# ---------------------------------------------------------------------
# Detecta el acceso a ficheros de configuración, bases de datos o
# directorios de control de versiones (.git).
#
# Capacidad 4: cuatro accesos DISTINTOS son un escaneo; uno solo
# puede ser una curiosidad de un usuario legítimo.
#
# Es la regla que más falsos positivos produce si se baja el umbral,
# y la que más rápido se dispara si se sube demasiado.
# =====================================================================

type: leaky
format: 2.0
name: crowdsecurity/http-sensitive-files
description: "Detect attempt to access sensitive files (.log, .db ..) or folders (.git)"
filter: 'evt.Meta.log_type in ["http_access-log", "http_error-log"] and any(File("sensitive_data.txt"), { evt.Parsed.request endsWith #})'
groupby: "evt.Meta.source_ip"
distinct: evt.Parsed.request
data:
  - source_url: https://raw.githubusercontent.com/crowdsecurity/sec-lists/master/web/sensitive_data.txt
    dest_file: sensitive_data.txt
    type: string
capacity: 4
leakspeed: 5s
blackhole: 5m
labels:
  service: http
  type: discovery
  remediation: true
