# =====================================================================
# CrowdSec · escenario propio · intentos de backdoor
# ---------------------------------------------------------------------
# Detecta peticiones a rutas de backdoor conocidas.
#
# Capacidad 1 y leakspeed 5 s: una sola petición a una ruta de
# backdoor es suficiente, porque la lista contiene rutas que no
# existen en un sitio legítimo. El riesgo de falso positivo es bajo
# y el valor de detección alto.
# =====================================================================

type: leaky
name: crowdsecurity/http-backdoors-attempts
description: "Detect attempt to common backdoors"
filter: 'evt.Meta.log_type in ["http_access-log", "http_error-log"] and any(File("backdoors.txt"), { evt.Parsed.file_name == #})'
groupby: "evt.Meta.source_ip"
distinct: evt.Parsed.file_name
data:
  - source_url: https://raw.githubusercontent.com/crowdsecurity/sec-lists/master/web/backdoors.txt
    dest_file: backdoors.txt
    type: string
capacity: 1
leakspeed: 5s
blackhole: 5m
labels:
  service: http
  type: discovery
  remediation: true
