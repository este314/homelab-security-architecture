# =====================================================================
# Coraza · reglas del WAF (OWASP CRS + excepciones acotadas)
# ---------------------------------------------------------------------
# Muestra anonimizada. La lógica de las excepciones es la real:
#
#   · NUNCA se desactiva una regla completa.
#   · La excepción se acota POR OBJETIVO (ARGS / ARGS_NAMES) y POR
#     FAMILIA de reglas, y sólo se aplica a las peticiones que
#     presentan el secreto compartido.
#   · La regla vive en fase 2 (post-cuerpo), de modo que la petición
#     tiene que superar el resto del procesamiento.
#
# El valor del secreto se inyecta desde el entorno. En un despliegue
# real, el fichero se genera en el arranque del servicio.
# =====================================================================

# ---------------------------------------------------------------
# 1. Carga del CRS
# ---------------------------------------------------------------
Include /etc/coraza-spoa/rules/coreruleset/rules/*.conf

# ---------------------------------------------------------------
# 2. Excepción acotada para una fuente de datos externa
# ---------------------------------------------------------------
#
# CONTEXTO
#
# Una fuente externa (hoja de cálculo → ingesta analítica) envía
# documentos JSON por POST. El CRS marca falsos positivos de SQLi y
# PHP sobre el texto libre de esos documentos, y el flujo legítimo
# se rompe con 403.
#
# DECISIÓN
#
# En lugar de abrir el WAF, se añade UNA regla que sólo se aplica si
# la petición presenta el secreto compartido. Sin cabecera o con
# cabecera incorrecta, la excepción no aplica y el CRS bloquea con
# normalidad.
#
# Lo que se retira, sólo cuando la petición presenta el secreto:
#   · la regla de CR/LF en argumentos (id 921150)
#   · las detecciones sobre ARGS y ARGS_NAMES de las familias
#     SQLI, PHP, RCE, XSS, LFI y RFI
#
# Lo que NO se retira nunca:
#   · el resto del CRS
#   · las reglas que operate sobre otras partes de la petición
#   · la inspección del cuerpo más allá de esos objetivos
#
# OPERACIÓN
#
# Rotar el secreto: cambiar el valor y reiniciar el motor. Durante
# la transición se puede usar una ventana dual con `@rx`:
#
#   SecRule REQUEST_HEADERS:X-Ingest-Token "@rx ^(VIEJO|NUEVO)$" "..."
#
# ---------------------------------------------------------------
SecRule REQUEST_HEADERS:X-Ingest-Token "@streq ${CORAZA_INGEST_TOKEN}" \
    "id:1000104,\
    phase:2,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=921150,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS_NAMES,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS_NAMES,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS_NAMES,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS_NAMES,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS_NAMES,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RFI;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RFI;ARGS_NAMES"

# ---------------------------------------------------------------
# 3. Ajustes de motor
# ---------------------------------------------------------------
#
# Body limit: por defecto no se inspecciona el cuerpo de peticiones
# grandes. Hay que decidirlo explícitamente en lugar de heredar el
# valor por defecto sin saberlo.
#
# SecRequestBodyAccess On
# SecRequestBodyLimit 13107200
# SecRequestBodyNoFilesLimit 131072
# SecRequestBodyLimitAction ProcessPartial
#
# Audit: se registra el evento que dispara la regla, con el detalle
# suficiente para triar sin tener que reproducir la petición.
#
# SecAuditEngine RelevantOnly
# SecAuditLogRelevantStatus "^(?:5|4(?!04))"
# SecAuditLogParts ABIJDEFHZ
# SecAuditLogType Serial
#
# Response body: no se inspecciona. El WAF protege el backend, no
# filtra la respuesta.
#
# SecResponseBodyAccess Off
